# typos configuration (PRD M10). https://github.com/crate-ci/typos

[default.extend-identifiers]
# Mermaid node ID in docs/architecture.md (PrismattycBackend, native).
PN = "PN"
# Fraction constraint docs/code use numer/denom (numerator / denominator).
numer = "numer"
denom = "denom"

[default.extend-words]
ratatui = "ratatui"
# RFC 4648 base64 input vector in lunatui-term/src/pixel/tests.rs.
fo = "fo"

[files]
# Asciinema recordings in examples/captures are raw terminal output, not prose.
# The HTML entity name table is generated data, not prose.
extend-exclude = ["*.cast", "lunatui-text/src/markdown/tables.rs"]
