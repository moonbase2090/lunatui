# typos configuration (PRD M10). https://github.com/crate-ci/typos

[default.extend-identifiers]
# Mermaid node ID in docs/architecture.md (PrismattycBackend, native).
PN = "PN"
# Fraction constraint docs/code use numer/denom (numerator / denominator).
numer = "numer"
denom = "denom"

[default.extend-words]
ratatui = "ratatui"
# RFC 4648 base64 input vector in lunatui-term/src/pixel/tests.rs.
fo = "fo"
# Exact HTML named character references generated in markdown/tables.rs.
Ofr = "Ofr"
andd = "andd"
becaus = "becaus"
BA = "BA"
curren = "curren"
equest = "equest"
ges = "ges"
infintie = "infintie"
lates = "lates"
ofr = "ofr"
oint = "oint"
olt = "olt"
pluse = "pluse"
pointint = "pointint"
scap = "scap"
ABD = "ABD"

[files]
# Asciinema recordings in examples/captures are raw terminal output, not prose.
extend-exclude = ["*.cast"]
