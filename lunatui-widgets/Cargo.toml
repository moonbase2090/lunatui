[package]
name = "lunatui-widgets"
description = "Widgets for lunatui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true

[lints]
workspace = true

[features]
default = ["pixel-pie-chart", "pixel-chart", "pixel-canvas", "pixel-barchart", "pixel-sparkline"]
color-profiles = ["lunatui-theme/color-profiles"]
widget-state = []
nested-menu = ["widget-state", "lunatui-theme/graphite-extensions"]
markdown = ["widget-state", "lunatui-text/markdown"]
line-gauge = ["widget-state"]
combo-box = ["widget-state", "search-box"]
button = ["widget-state"]
calendar = ["widget-state"]
date-picker = ["widget-state", "calendar"]
sparkline = ["widget-state"]
pixel-sparkline = ["sparkline", "image"]
chart = ["widget-state"]
pixel-chart = ["chart", "image"]
canvas = ["widget-state"]
pixel-canvas = ["canvas", "image"]

barchart = ["widget-state"]
pixel-barchart = ["barchart", "image"]
toast = ["widget-state"]
notification-center = ["widget-state", "toast"]
slider = ["widget-state"]
number-input = ["widget-state"]
diff-view = ["widget-state"]
search-box = ["widget-state"]
log-view = ["widget-state"]
progress = ["widget-state"]
accordion = ["widget-state"]
hex-viewer = ["widget-state"]
pie-chart = ["widget-state"]
pixel-pie-chart = ["pie-chart", "image"]
form = ["widget-state"]
radio = ["widget-state"]
toggle = ["widget-state"]
tooltip = []
popover = ["popup"]
dialog = ["popup"]
bigtext = ["widget-state", "lunatui-core/subcell"]
image = ["color-profiles", "dep:lunatui-image", "widget-state"]
image-decode = ["image", "lunatui-image/decode"]
key-hints = ["dep:lunatui-runtime"]
popup = ["widget-state"]
scroll-view = ["widget-state", "lunatui-core/blit"]
graphite-render = ["lunatui-theme/graphite-tokens"]
all-widgets = ["accordion", "barchart", "pixel-barchart", "bigtext", "button", "calendar", "canvas", "pixel-canvas", "chart", "pixel-chart", "combo-box", "date-picker", "diff-view", "dialog", "form", "hex-viewer", "key-hints", "line-gauge", "log-view", "markdown", "nested-menu", "notification-center", "number-input", "pie-chart", "pixel-pie-chart", "popover", "popup", "progress", "radio", "scroll-view", "search-box", "slider", "sparkline", "pixel-sparkline", "toast", "toggle", "tooltip"]

[dependencies]
lunatui-core = { version = "0.1.17", path = "../lunatui-core" }
lunatui-layout = { version = "0.1.17", path = "../lunatui-layout" }
lunatui-image = { version = "0.1.17", path = "../lunatui-image", optional = true }
lunatui-text = { version = "0.1.17", path = "../lunatui-text" }
lunatui-theme = { version = "0.1.17", path = "../lunatui-theme" }
lunatui-runtime = { version = "0.1.17", path = "../lunatui-runtime", optional = true, features = ["keymap"] }
unicode-segmentation = "=1.13.3"

tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
lunatui-test = { version = "0.1.17", path = "../lunatui-test" }
lunatui-term = { version = "0.1.17", path = "../lunatui-term" }
ratatui = "=0.30.2"
tui-menu = "=0.3.1"
proptest = "=1.9.0"
time = { version = "=0.3.55", default-features = false }

[[test]]
name = "block"
path = "tests/block.rs"

[[test]]
name = "graphite_render"
path = "tests/graphite_render.rs"
