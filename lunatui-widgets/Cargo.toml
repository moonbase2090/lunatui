[package]
name = "lunatui-widgets"
description = "Widgets for lunatui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND OFL-1.1"
repository.workspace = true

[lints]
workspace = true

[features]
default = []
color-profiles = ["lunatui-theme/color-profiles"]
widget-state = []
line-gauge = ["widget-state"]
calendar = ["widget-state"]
sparkline = ["widget-state"]
barchart = []
bigtext = ["widget-state", "lunatui-core/subcell"]

[dependencies]
lunatui-core = { version = "0.1.11", path = "../lunatui-core" }
lunatui-layout = { version = "0.1.11", path = "../lunatui-layout" }
lunatui-text = { version = "0.1.11", path = "../lunatui-text" }
lunatui-theme = { version = "0.1.11", path = "../lunatui-theme" }
unicode-segmentation = "=1.13.3"

[dev-dependencies]
lunatui-test = { version = "0.1.11", path = "../lunatui-test" }
ratatui = "=0.30.2"
time = { version = "=0.3.55", default-features = false }

[[test]]
name = "block"
path = "tests/block.rs"

[[test]]
name = "block_ratatui"
path = "tests/block_ratatui.rs"

[[test]]
name = "paragraph_ratatui"
path = "tests/paragraph_ratatui.rs"

[[test]]
name = "table"
path = "tests/table.rs"

[[test]]
name = "chrome"
path = "tests/chrome.rs"

[[test]]
name = "tabs"
path = "tests/tabs.rs"

[[test]]
name = "text_input"
path = "tests/text_input.rs"

[[test]]
name = "list"
path = "tests/list.rs"

[[test]]
name = "gauge"
path = "tests/gauge.rs"

[[test]]
name = "line_gauge"
path = "tests/line_gauge.rs"
required-features = ["line-gauge"]

[[test]]
name = "bar_chart"
path = "tests/bar_chart.rs"
required-features = ["barchart"]

[[test]]
name = "overlay"
path = "tests/overlay.rs"

[[test]]
name = "calendar"
path = "tests/calendar.rs"
required-features = ["calendar"]

[[test]]
name = "status_dot_color_profiles"
path = "tests/status_dot_color_profiles.rs"
required-features = ["color-profiles"]

[[test]]
name = "bigtext"
path = "tests/bigtext.rs"
required-features = ["bigtext"]

[[test]]
name = "sparkline"
path = "tests/sparkline.rs"
required-features = ["sparkline"]
