[package]
name = "lunatui-widgets"
description = "Widgets for lunatui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND OFL-1.1"
repository.workspace = true

[lints]
workspace = true

[features]
default = []
color-profiles = ["lunatui-theme/color-profiles"]
widget-state = []
markdown = ["widget-state", "lunatui-text/markdown"]
line-gauge = ["widget-state"]
calendar = ["widget-state"]
sparkline = ["widget-state"]
chart = ["widget-state"]
canvas = ["widget-state"]

barchart = ["widget-state"]
toast = ["widget-state"]
slider = ["widget-state"]
number-input = ["widget-state"]
search-box = ["widget-state"]
log-view = ["widget-state"]
diff-view = ["widget-state"]
progress = ["widget-state"]
accordion = ["widget-state"]
hex-viewer = ["widget-state"]
form = ["widget-state"]
radio = ["widget-state"]
toggle = ["widget-state"]
tooltip = []
bigtext = ["widget-state", "lunatui-core/subcell"]
image = ["color-profiles", "dep:lunatui-image", "widget-state"]
image-decode = ["image", "lunatui-image/decode"]
key-hints = ["dep:lunatui-runtime"]
popup = ["widget-state"]
scroll-view = ["widget-state", "lunatui-core/blit"]
graphite-render = ["lunatui-theme/graphite-tokens"]
all-widgets = ["accordion", "barchart", "bigtext", "calendar", "canvas", "chart", "diff-view", "form", "hex-viewer", "key-hints", "line-gauge", "log-view", "markdown", "number-input", "popup", "progress", "radio", "scroll-view", "search-box", "slider", "sparkline", "toast", "toggle", "tooltip"]

[dependencies]
lunatui-core = { version = "0.1.15", path = "../lunatui-core" }
lunatui-layout = { version = "0.1.15", path = "../lunatui-layout" }
lunatui-image = { version = "0.1.15", path = "../lunatui-image", optional = true }
lunatui-text = { version = "0.1.15", path = "../lunatui-text" }
lunatui-theme = { version = "0.1.15", path = "../lunatui-theme" }
lunatui-runtime = { version = "0.1.15", path = "../lunatui-runtime", optional = true, features = ["keymap"] }
unicode-segmentation = "=1.13.3"

[dev-dependencies]
lunatui-test = { version = "0.1.15", path = "../lunatui-test" }
lunatui-term = { version = "0.1.15", path = "../lunatui-term" }
ratatui = "=0.30.2"
proptest = "=1.9.0"
time = { version = "=0.3.55", default-features = false }

[[test]]
name = "block"
path = "tests/block.rs"

[[test]]
name = "graphite_render"
path = "tests/graphite_render.rs"
required-features = ["graphite-render"]

