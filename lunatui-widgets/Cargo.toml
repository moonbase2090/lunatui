[package]
name = "lunatui-widgets"
description = "Widgets for lunatui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND OFL-1.1"
repository.workspace = true

[lints]
workspace = true

[features]
default = []
color-profiles = ["lunatui-theme/color-profiles"]
widget-state = []
markdown = ["widget-state", "lunatui-text/markdown"]
line-gauge = [
    "widget-state",
    "color-profiles",
    "lunatui-core/subcell",
    "lunatui-theme/graphite-tokens",
]
calendar = ["widget-state"]
sparkline = ["widget-state"]
chart = ["widget-state"]
canvas = ["widget-state"]

barchart = ["widget-state"]
toast = ["widget-state"]
bigtext = ["widget-state", "lunatui-core/subcell"]
image = ["color-profiles", "dep:lunatui-image", "widget-state"]
image-decode = ["image", "lunatui-image/decode"]
key-hints = ["dep:lunatui-runtime"]

[dependencies]
lunatui-core = { version = "0.1.13", path = "../lunatui-core" }
lunatui-layout = { version = "0.1.13", path = "../lunatui-layout" }
lunatui-image = { version = "0.1.13", path = "../lunatui-image", optional = true }
lunatui-text = { version = "0.1.13", path = "../lunatui-text" }
lunatui-theme = { version = "0.1.13", path = "../lunatui-theme" }
lunatui-runtime = { version = "0.1.13", path = "../lunatui-runtime", optional = true, features = ["keymap"] }
unicode-segmentation = "=1.13.3"

[dev-dependencies]
lunatui-test = { version = "0.1.13", path = "../lunatui-test" }
lunatui-term = { version = "0.1.13", path = "../lunatui-term" }
ratatui = "=0.30.2"
proptest = "=1.9.0"
time = { version = "=0.3.55", default-features = false }

[[test]]
name = "block"
path = "tests/block.rs"

[[test]]
name = "block_ratatui"
path = "tests/block_ratatui.rs"

[[test]]
name = "paragraph_ratatui"
path = "tests/paragraph_ratatui.rs"

[[test]]
name = "table"
path = "tests/table.rs"

[[test]]
name = "chrome"
path = "tests/chrome.rs"

[[test]]
name = "tabs"
path = "tests/tabs.rs"

[[test]]
name = "text_input"
path = "tests/text_input.rs"

[[test]]
name = "list"
path = "tests/list.rs"

[[test]]
name = "gauge"
path = "tests/gauge.rs"

[[test]]
name = "line_gauge"
path = "tests/line_gauge.rs"
required-features = ["line-gauge"]

[[test]]
name = "overlay"
path = "tests/overlay.rs"

[[test]]
name = "calendar"
path = "tests/calendar.rs"
required-features = ["calendar"]

[[test]]
name = "status_dot_color_profiles"
path = "tests/status_dot_color_profiles.rs"
required-features = ["color-profiles"]

[[test]]
name = "bigtext"
path = "tests/bigtext.rs"
required-features = ["bigtext"]

[[test]]
name = "sparkline"
path = "tests/sparkline.rs"
required-features = ["sparkline"]

[[test]]
name = "spinner_presets"
path = "tests/spinner_presets.rs"

[[test]]
name = "image"
path = "tests/image.rs"
required-features = ["image"]

[[test]]
name = "chart"
path = "tests/chart.rs"
required-features = ["chart"]

[[test]]
name = "chart_ratatui"
path = "tests/chart_ratatui.rs"
required-features = ["chart"]

[[test]]
name = "bar_chart"
path = "tests/bar_chart.rs"
required-features = ["barchart"]

[[test]]
name = "markdown_view"
path = "tests/markdown_view.rs"
required-features = ["markdown"]

[[test]]
name = "canvas"
path = "tests/canvas.rs"
required-features = ["canvas"]

[[test]]
name = "canvas_ratatui"
path = "tests/canvas_ratatui.rs"
required-features = ["canvas"]

[[test]]
name = "toast"
path = "tests/toast.rs"
required-features = ["toast"]

[[test]]
name = "key_hint_bar"
path = "tests/key_hint_bar.rs"
required-features = ["key-hints"]
