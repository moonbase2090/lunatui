[package]
name = "lunatui-web"
description = "Browser driver for the Lunatui quickstart sandbox."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lunatui-core = { path = "../lunatui-core" }
lunatui-runtime = { path = "../lunatui-runtime", default-features = false, features = ["app"] }
lunatui-term = { path = "../lunatui-term" }
lunatui-theme = { path = "../lunatui-theme" }
lunatui-widgets = { path = "../lunatui-widgets", default-features = false, features = ["form"] }
wasm-bindgen = "=0.2.129"
