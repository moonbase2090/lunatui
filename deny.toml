# cargo-deny configuration (PRD M10). https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Widen deliberately as dependencies arrive. MIT, Apache-2.0 and Unicode-3.0
# arrived with criterion and gungraun (PR 02), Zlib with ratatui (foldhash).
# BSD-3-Clause covers tiny-skia; BSD-2-Clause covers its arrayref dependency.
# OFL-1.1 covers the bitmap face shipped in lunatui-widgets.
allow = ["MIT", "MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "OFL-1.1", "BSD-3-Clause", "BSD-2-Clause"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# tui-popup and tui-scrollview (with derive-getters and derive_setters) are
# comparison baselines for the Popup and ScrollView bench cases only.
# PRD M16: only these external crates may appear in the dependency graph,
# including transitive and platform-specific ones. Adding one, and any
# dependency bump (Cargo.lock), needs MB2090 sign-off (.github/CODEOWNERS).
allow = [
    # Workspace crates.
    "lunatui",
    "lunatui-bench",
    "lunatui-badge",
    "lunatui-button",
