# cargo-deny configuration (PRD M10). https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Widen deliberately as dependencies arrive. MIT, Apache-2.0 and Unicode-3.0
# arrived with criterion and gungraun (PR 02).
allow = ["MPL-2.0", "MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# PRD M16: only these external crates may appear in the dependency graph,
# including transitive and platform-specific ones. Adding one, and any
# dependency bump (Cargo.lock), needs MB2090 sign-off (.github/CODEOWNERS).
allow = [
    # Workspace crates.
    "lunatui",
    "lunatui-bench",
    "lunatui-core",
    "lunatui-layout",
    "lunatui-prismattyc",
    "lunatui-ratatui",
    "lunatui-runtime",
    "lunatui-term",
    "lunatui-test",
    "lunatui-text",
    "lunatui-theme",
    "lunatui-widgets",
    "xtask",
    # External crates.
    "aho-corasick",
    "alloca",
    "anes",
    "anstyle",
    "autocfg",
    "bincode-next",
    "cast",
    "cc",
    "cfg-if",
    "ciborium",
    "ciborium-io",
    "ciborium-ll",
    "clap",
    "clap_builder",
    "clap_lex",
    "criterion",
    "criterion-plot",
    "crunchy",
    "derive_more",
    "derive_more-impl",
    "either",
    "either-or-both",
    "equivalent",
    "find-msvc-tools",
    "gungraun",
    "gungraun-common",
    "gungraun-macros",
    "gungraun-runner",
    "half",
    "hashbrown",
    "indexmap",
    "itertools",
    "itoa",
    "libc",
    "memchr",
    "num-traits",
    "oorandom",
    "page_size",
    "proc-macro-error-attr3",
    "proc-macro-error3",
    "proc-macro2",
    "quote",
    "regex",
    "regex-automata",
    "regex-syntax",
    "rustc_version",
    "same-file",
    "semver",
    "serde",
    "serde_core",
    "serde_derive",
    "serde_json",
    "shlex",
    "syn",
    "tinytemplate",
    "unicode-ident",
    "unty-next",
    "walkdir",
    "winapi",
    "winapi-i686-pc-windows-gnu",
    "winapi-util",
    "winapi-x86_64-pc-windows-gnu",
    "windows-link",
    "windows-sys",
    "zerocopy",
    "zerocopy-derive",
    "zmij",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
