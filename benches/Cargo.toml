[package]
name = "lunatui-bench"
description = "Benchmark harness for lunatui: counting allocator, write and byte counters, and calibration workloads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
pixel-layer = ["lunatui-term/pixel-layer"]
render-color = ["lunatui-core/render-color"]
subcell = ["lunatui-core/subcell"]
graphite-tokens = ["lunatui-theme/graphite-tokens", "lunatui-theme/color-profiles"]
# gungraun needs Linux and valgrind, so its benchmarks are opt-in.
gungraun = ["dep:gungraun"]

[dependencies]
gungraun = { version = "0.20.0", optional = true }
lunatui-core = { version = "0.1.14", path = "../lunatui-core" }
lunatui-layout = { version = "0.1.14", path = "../lunatui-layout" }
lunatui-text = { version = "0.1.14", path = "../lunatui-text", features = ["markdown"] }
lunatui-theme = { version = "0.1.14", path = "../lunatui-theme" }
lunatui-widgets = { version = "0.1.14", path = "../lunatui-widgets", features = ["barchart", "number-input", "slider", "form", "radio", "toggle", "bigtext", "calendar", "canvas", "chart", "key-hints", "markdown", "popup", "scroll-view", "sparkline", "toast", "tooltip"] }
lunatui-runtime = { version = "0.1.14", path = "../lunatui-runtime", features = ["keymap"] }
lunatui-term = { version = "0.1.14", path = "../lunatui-term" }
lunatui-prismattyc = { version = "0.1.14", path = "../lunatui-prismattyc" }
num-bigint = "0.4"
num-traits = "0.2"
ratatui = "=0.30.2"
time = { version = "=0.3.55", default-features = false }
libc = "0.2.190"
tui-popup = "=0.7.7"
tui-scrollview = "=0.6.8"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "metrics"
harness = false

[[bench]]
name = "ceiling"
harness = false

[[bench]]
name = "criterion_calibration"
harness = false

[[bench]]
name = "criterion_ratatui"
harness = false

[[bench]]
name = "criterion_lunatui"
harness = false

[[bench]]
name = "criterion_cell_prototype"
harness = false

[[bench]]
name = "criterion_core_text_width"
harness = false

[[bench]]
name = "criterion_lunatui_encode"
harness = false

[[bench]]
name = "criterion_lunatui_grid_sink"
harness = false

[[bench]]
name = "gungraun_calibration"
harness = false
required-features = ["gungraun"]

[[test]]
name = "harness_self_test"
harness = false

[[bench]]
name = "criterion_core_diff"
harness = false

[[bench]]
name = "widget_suite"
harness = false

[[bench]]
name = "criterion_widgets"
harness = false

[[test]]
name = "pixel_layer_allocs"
path = "tests/pixel_layer_allocs.rs"
required-features = ["pixel-layer"]

[[test]]
name = "render_color_allocs"
path = "tests/render_color_allocs.rs"
required-features = ["render-color"]

[[test]]
name = "subcell_allocs"
path = "tests/subcell_allocs.rs"
required-features = ["subcell"]

[[test]]
name = "graphite_token_allocs"
path = "tests/graphite_token_allocs.rs"
required-features = ["graphite-tokens"]
