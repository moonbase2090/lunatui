[package]
name = "lunatui-bench"
description = "Benchmark harness for lunatui: counting allocator, write and byte counters, and calibration workloads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# gungraun needs Linux and valgrind, so its benchmarks are opt-in.
gungraun = ["dep:gungraun"]

[dependencies]
gungraun = { version = "0.20.0", optional = true }
lunatui-core = { version = "0.1.0", path = "../lunatui-core" }
lunatui-layout = { version = "0.1.0", path = "../lunatui-layout" }
lunatui-text = { version = "0.1.0", path = "../lunatui-text" }
lunatui-theme = { version = "0.1.0", path = "../lunatui-theme" }
lunatui-widgets = { version = "0.1.0", path = "../lunatui-widgets" }
num-bigint = "0.4"
num-traits = "0.2"
ratatui = "=0.30.2"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "metrics"
harness = false

[[bench]]
name = "ceiling"
harness = false

[[bench]]
name = "criterion_calibration"
harness = false

[[bench]]
name = "criterion_ratatui"
harness = false

[[bench]]
name = "criterion_lunatui"
harness = false

[[bench]]
name = "criterion_cell_prototype"
harness = false

[[bench]]
name = "criterion_core_diff"
harness = false

[[bench]]
name = "gungraun_calibration"
harness = false
required-features = ["gungraun"]

[[test]]
name = "harness_self_test"
harness = false
