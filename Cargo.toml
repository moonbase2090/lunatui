[workspace]
resolver = "3"
members = [
    "lunatui",
    "lunatui-core",
    "lunatui-layout",
    "lunatui-text",
    "lunatui-term",
    "lunatui-runtime",
    "lunatui-theme",
    "lunatui-image",
    "lunatui-widgets",
    "lunatui-ui-tokens",
    "lunatui-card",
    "lunatui-badge",
    "lunatui-button",
    "lunatui-field",
    "lunatui-test",
    "lunatui-ratatui",
    "lunatui-prismattyc",
    "benches",
    "xtask",
    "lunatui-web",
]

[workspace.package]
version = "0.1.19"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/moonbase2090/lunatui"

# PRD M10 and M16: docs on every public item, pedantic clippy, and restriction
# lints so only the canonical patterns compile.
[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
