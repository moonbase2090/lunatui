[package]
name = "lunatui-field"
description = "Field component for lunatui: a label, a control, and a help or error line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lunatui-runtime = { version = "0.1.31", path = "../lunatui-runtime", default-features = false, features = ["app"] }
lunatui-core = { version = "0.1.31", path = "../lunatui-core" }
lunatui-ui-tokens = { version = "0.1.31", path = "../lunatui-ui-tokens" }
lunatui-widgets = { version = "0.1.31", path = "../lunatui-widgets", features = ["widget-state"] }

[dev-dependencies]
lunatui-test = { version = "0.1.31", path = "../lunatui-test" }
lunatui-widgets = { version = "0.1.31", path = "../lunatui-widgets", features = ["scroll-view", "button", "toggle"] }
lunatui-badge = { version = "0.1.31", path = "../lunatui-badge" }
lunatui-button = { version = "0.1.31", path = "../lunatui-button" }
lunatui-card = { version = "0.1.31", path = "../lunatui-card" }
lunatui-term = { version = "0.1.31", path = "../lunatui-term" }
lunatui-theme = { version = "0.1.31", path = "../lunatui-theme" }

[[example]]
name = "ui_field"
path = "examples/ui_field.rs"
test = true
