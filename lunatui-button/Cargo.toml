[package]
name = "lunatui-button"
description = "Button and Toggle components for lunatui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lunatui-core = { version = "0.1.19", path = "../lunatui-core" }
lunatui-ui-tokens = { version = "0.1.19", path = "../lunatui-ui-tokens" }
lunatui-widgets = { version = "0.1.19", path = "../lunatui-widgets", features = ["button"] }

[dev-dependencies]
lunatui-badge = { version = "0.1.19", path = "../lunatui-badge" }
lunatui-card = { version = "0.1.19", path = "../lunatui-card" }
lunatui-term = { version = "0.1.19", path = "../lunatui-term" }
lunatui-theme = { version = "0.1.19", path = "../lunatui-theme" }

[[example]]
name = "ui_button"
path = "examples/ui_button.rs"
test = true
