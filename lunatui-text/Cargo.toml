[package]
name = "lunatui-text"
description = "Text for lunatui: borrowed spans, lines and text, measurement, WrapCache and RowSource."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
markdown = []

[dependencies]
lunatui-core = { version = "0.1.16", path = "../lunatui-core" }
unicode-segmentation = "=1.13.3"

[dev-dependencies]
proptest = "=1.9.0"

[[test]]
name = "markdown"
path = "tests/markdown.rs"
required-features = ["markdown"]
