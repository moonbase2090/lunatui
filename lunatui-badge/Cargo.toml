[package]
name = "lunatui-badge"
description = "Badge and Kbd components for lunatui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lunatui-core = { version = "0.1.37", path = "../lunatui-core" }
lunatui-ui-tokens = { version = "0.1.37", path = "../lunatui-ui-tokens" }
lunatui-widgets = { version = "0.1.37", path = "../lunatui-widgets" }

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
lunatui-card = { version = "0.1.37", path = "../lunatui-card" }
lunatui-image = { version = "0.1.37", path = "../lunatui-image" }
lunatui-runtime = { version = "0.1.37", path = "../lunatui-runtime" }
lunatui-term = { version = "0.1.37", path = "../lunatui-term" }
lunatui-theme = { version = "0.1.37", path = "../lunatui-theme" }
serde_json = "1.0.149"

[[example]]
name = "ui_badge"
path = "examples/ui_badge.rs"
test = true

[[example]]
name = "graphite_chips"
path = "examples/graphite_chips.rs"
test = true
