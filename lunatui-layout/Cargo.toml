[package]
name = "lunatui-layout"
description = "Layout engine for lunatui: constraints, closed-form solver, solver fallback, Grid/Stack and memo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Per-segment floors and caps (`Layout::limits`) and `aspect_fit`.
size-limits = []

[[test]]
name = "size_limits"
required-features = ["size-limits"]

[dependencies]
lunatui-core = { version = "0.1.11", path = "../lunatui-core" }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }

[dev-dependencies]
proptest = "=1.9.0"
ratatui = "=0.30.2"
