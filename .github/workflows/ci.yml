name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked -p lunatui-bench --features graphite-tokens --test graphite_token_allocs
      - run: cargo test --locked -p lunatui-core --features subcell
      - run: cargo test --locked -p lunatui-bench --features subcell --test subcell_allocs
      - run: cargo test --locked -p lunatui-core --features render-color
      - run: cargo test --locked -p lunatui-bench --features render-color --test render_color_allocs
      - run: cargo test -p lunatui-widgets --features color-profiles,barchart,bigtext,calendar,canvas,chart,markdown,sparkline,toast,toggle,radio,tooltip
      - run: cargo test --locked -p lunatui-term --features pixel-layer
      - run: cargo test --locked -p lunatui-bench --features pixel-layer --test pixel_layer_allocs
      # `app` is off by default. Select the packages that define it so
      # Windows and macOS build and test that feature, including the demo.
      - run: cargo build -p lunatui -p lunatui-runtime --features app
      - run: cargo test -p lunatui -p lunatui-runtime --features app,keymap,motion
      - run: cargo run --example hello_box
      - run: cargo run --example hello_box -- --metrics

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace --all-targets --all-features

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@v1.50.3

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install --yes valgrind
      # Must match the gungraun version in Cargo.lock.
      - run: cargo install gungraun-runner --version 0.20.0 --locked
        env:
          RUSTFLAGS: ""
      - run: cargo xtask bench

  gallery-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-gallery-real-output-selftest.sh
      - run: ./scripts/check-gallery-real-output.sh
      - run: ./scripts/trim-cast-selftest.sh
