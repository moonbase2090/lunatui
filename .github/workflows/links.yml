name: Links

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: moonbase2090/.github/actions/package-links@a28feceb0e683975c46c882a9914b9b6f3ae8eb6
        with:
          link-paths: "'./*.md' './docs/**/*.md' './lunatui*/README.md' './site/**/*.html' './site/**/*.md'"
