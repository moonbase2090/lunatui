name: Sign-off

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit SHA for the change
        required: true
        type: string
      head_sha:
        description: Head commit SHA for the change
        required: true
        type: string
      signoff_label:
        description: Whether the pull request has the mb2090-signoff label
        required: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask signoff "$BASE" "$HEAD" "$LABELED"
        env:
          BASE: ${{ inputs.base_sha }}
          HEAD: ${{ inputs.head_sha }}
          LABELED: ${{ inputs.signoff_label }}
