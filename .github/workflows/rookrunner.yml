name: Rookrunner

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --default-toolchain stable --profile minimal --component rustfmt --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --default-toolchain stable --profile minimal --component clippy --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --default-toolchain stable --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo test --workspace
      - run: cargo run --example hello_box
      - run: cargo run --example hello_box -- --metrics

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --default-toolchain stable --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo xtask check

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --default-toolchain stable --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo doc --workspace --no-deps

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --default-toolchain 1.88 --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo check --workspace --all-targets --all-features
