name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for dry-run checks), e.g. v0.1.0
        required: true
        type: string
      release_title:
        description: Planned GitHub release title
        required: true
        type: string
      release_body:
        description: Planned GitHub release body
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check-release-text:
    name: Release text gate
    runs-on: ubuntu-latest
    env:
      RELEASE_DENYLIST: ${{ secrets.RELEASE_DENYLIST }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve tag message
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_TITLE: ${{ inputs.release_title }}
          DISPATCH_BODY: ${{ inputs.release_body }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${DISPATCH_TAG}"
          fi
          TAG_MESSAGE="$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TITLE="${DISPATCH_TITLE}"
            BODY="${DISPATCH_BODY}"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            TITLE="$(gh release view "$TAG" --json name -q .name)"
            BODY="$(gh release view "$TAG" --json body -q .body)"
          else
            TITLE=""
            BODY=""
          fi
          {
            echo "tag=$TAG"
            echo "tag_message<<EOF"
            echo "$TAG_MESSAGE"
            echo "EOF"
            echo "release_title<<EOF"
            echo "$TITLE"
            echo "EOF"
            echo "release_body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Build release binaries for strings scan
        env:
          RUSTFLAGS: -D warnings --remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=${{ env.HOME }}=~
        run: cargo build --release --locked --example hello_box

      - name: Scan release text and artifacts
        env:
          TAG_MESSAGE: ${{ steps.meta.outputs.tag_message }}
          RELEASE_TITLE: ${{ steps.meta.outputs.release_title }}
          RELEASE_BODY: ${{ steps.meta.outputs.release_body }}
        run: |
          set -euo pipefail
          chmod +x scripts/check-release-text.sh
          ./scripts/check-release-text.sh \
            --tag-message "$TAG_MESSAGE" \
            --release-title "$RELEASE_TITLE" \
            --release-body "$RELEASE_BODY" \
            --artifact-dir target/release/examples

  publish:
    name: Publish (placeholder)
    needs: check-release-text
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release publish steps will run here after packaging is defined."
