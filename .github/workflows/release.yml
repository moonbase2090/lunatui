name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag
        type: string
        required: true

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.check.outputs.commit }}
      tag_object: ${{ steps.check.outputs.tag_object }}
    steps:
      - name: Select release tag
        id: tag
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a release tag in vMAJOR.MINOR.PATCH form" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Release recovery must use the workflow on main" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag
        id: check
        env:
          EXPECTED_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/$TAG"
          if [[ "$(git cat-file -t "$TAG_REF")" != tag ]]; then
            echo "Release requires an annotated tag object" >&2
            exit 1
          fi
          TAG_OBJECT="$(git rev-parse "$TAG_REF")"
          COMMIT="$(git rev-parse "$TAG_REF^{commit}")"
          if [[ "$COMMIT" != "$(git rev-parse HEAD)" || ( -n "$EXPECTED_COMMIT" && "$COMMIT" != "$EXPECTED_COMMIT" ) ]]; then
            echo "Release checkout does not match the selected tag commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "Selected tag does not point at a commit on main" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          if ! grep -Fxq "version = \"${VERSION}\"" Cargo.toml; then
            echo "Workspace version does not match the selected tag" >&2
            exit 1
          fi
          TAG_CONTENTS="$(git cat-file tag "$TAG_REF")"
          if ! grep -q 'BEGIN SSH SIGNATURE\|BEGIN PGP SIGNATURE' <<< "$TAG_CONTENTS"; then
            echo "Annotated release tag has no signature block" >&2
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag_object=$TAG_OBJECT" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: cargo test --workspace --locked

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
      TAG_OBJECT: ${{ needs.verify.outputs.tag_object }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_DENYLIST: ${{ secrets.RELEASE_DENYLIST }}
    steps:
      - name: Check for existing release
        id: existing
        run: |
          set -euo pipefail
          RELEASE_ID="$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { release(tagName: $tag) { id } } }' \
            -f owner="${GITHUB_REPOSITORY%/*}" \
            -f name="${GITHUB_REPOSITORY#*/}" \
            -f tag="$TAG" \
            --jq '.data.repository.release.id // empty')"
          if [[ -n "$RELEASE_ID" ]]; then
            echo "Release already exists; leaving it unchanged"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          fetch-depth: 0

      - if: steps.existing.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Check publication checkout
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "refs/tags/$TAG")" = "$TAG_OBJECT"

      - name: Prepare release metadata
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import re
          import subprocess


          def git(*args):
              result = subprocess.run(["git", *args], capture_output=True, text=True)
              if result.returncode:
                  raise SystemExit("Could not read the selected release tag metadata")
              return result.stdout


          tag = os.environ["TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit("Expected vMAJOR.MINOR.PATCH release tag")
          ref = "refs/tags/" + tag
          git("rev-parse", "--verify", ref + "^{tag}")
          title = git("for-each-ref", "--format=%(contents:subject)", ref).strip()
          notes = git("for-each-ref", "--format=%(contents:body)", ref).strip()
          source = "tag body"
          if not notes:
              changelog = git("show", ref + ":CHANGELOG.md")
              pattern = r"^## \[" + re.escape(tag[1:]) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)"
              section = re.search(pattern, changelog, re.MULTILINE | re.DOTALL)
              if not section:
                  raise SystemExit("Empty tag body and no matching changelog section")
              notes = section.group(1).strip()
              source = "tagged changelog"
          if not title or not notes:
              raise SystemExit("Release title and notes must contain prose")
          if re.search(r"-----BEGIN (?:SSH|PGP) SIGNATURE-----", title + "\n" + notes):
              raise SystemExit("Signature block found in release title or notes")
          output = Path(os.environ["RUNNER_TEMP"])
          (output / "release-title.txt").write_text(title + "\n")
          (output / "release-notes.txt").write_text(notes + "\n")
          print("Prepared release metadata from " + source)
          PYTHON

      - name: Build release binaries
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          export RUSTFLAGS="-D warnings --remap-path-prefix=${GITHUB_WORKSPACE}=. --remap-path-prefix=${HOME}=~"
          cargo build --release --locked --example hello_box

      - name: Scan release text and artifacts
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/check-release-text.sh
          ./scripts/check-release-text.sh \
            --tag-message "$(git tag -l --format='%(contents)' "$TAG")" \
            --release-title "$(cat "$RUNNER_TEMP/release-title.txt")" \
            --release-body "$(cat "$RUNNER_TEMP/release-notes.txt")" \
            --artifact-dir target/release/examples

      - name: Package assets
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="lunatui-${TAG#v}/" \
            -o "dist/lunatui-${TAG}-source.tar.gz" "$RELEASE_COMMIT"
          tar -czf "dist/hello_box-${TAG}-linux-x86_64.tar.gz" \
            -C target/release/examples hello_box
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$(cat "$RUNNER_TEMP/release-title.txt")" \
            --notes-file "$RUNNER_TEMP/release-notes.txt"
