[package]
name = "lunatui"
description = "Facade for lunatui: re-exports, prelude and run()."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autoexamples = false

[lints]
workspace = true

[features]
default = []
color-profiles = ["lunatui-theme/color-profiles"]
app = ["lunatui-runtime/app", "dep:lunatui-runtime"]
image-presenter = ["app", "lunatui-runtime/image-presenter"]
image-decode = ["lunatui-widgets/image-decode"]
keymap = ["app", "lunatui-runtime/keymap"]

[dependencies]
lunatui-runtime = { version = "0.1.13", path = "../lunatui-runtime", optional = true }

[dev-dependencies]
lunatui-bench = { path = "../benches" }
lunatui-core = { path = "../lunatui-core" }
lunatui-image = { path = "../lunatui-image" }
lunatui-term = { path = "../lunatui-term" }
lunatui-text = { path = "../lunatui-text", features = ["markdown"] }
lunatui-theme = { path = "../lunatui-theme" }
lunatui-runtime = { path = "../lunatui-runtime", features = ["app"] }
lunatui-test = { path = "../lunatui-test" }
lunatui-widgets = { version = "0.1.13", path = "../lunatui-widgets", features = ["barchart", "form", "radio", "toggle", "bigtext", "calendar", "canvas", "chart", "image", "key-hints", "markdown", "sparkline", "toast"] }
lunatui-ratatui = { path = "../lunatui-ratatui" }
lunatui-prismattyc = { version = "0.1.13", path = "../lunatui-prismattyc" }
ratatui = "=0.30.2"
time = { version = "=0.3.55", default-features = false }
libc = "0.2.190"

# Examples live in the top-level `examples/` directory (PRD M13) and are
# listed here so each one runs with `cargo run --example <name>`.
[[example]]
name = "keys"
path = "../examples/keys.rs"
test = true

[[example]]
name = "hello_box"
path = "../examples/hello_box.rs"
test = true

[[example]]
name = "caps"
path = "../examples/caps.rs"
test = true

[[example]]
name = "gradient"
path = "../examples/gradient.rs"
test = true
required-features = ["color-profiles"]

[[example]]
