[package]
name = "lunatui"
description = "Facade for lunatui: re-exports, prelude and run()."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autoexamples = false

[lints]
workspace = true

[features]
default = []
color-profiles = ["lunatui-theme/color-profiles"]
app = ["lunatui-runtime/app", "dep:lunatui-runtime"]

[dependencies]
lunatui-runtime = { version = "0.1.3", path = "../lunatui-runtime", optional = true }

[dev-dependencies]
lunatui-bench = { path = "../benches" }
lunatui-core = { path = "../lunatui-core" }
lunatui-term = { path = "../lunatui-term" }
lunatui-theme = { path = "../lunatui-theme" }
lunatui-runtime = { path = "../lunatui-runtime", features = ["app"] }
lunatui-test = { path = "../lunatui-test" }
lunatui-widgets = { version = "0.1.3", path = "../lunatui-widgets" }
lunatui-ratatui = { path = "../lunatui-ratatui" }
lunatui-prismattyc = { version = "0.1.3", path = "../lunatui-prismattyc" }
ratatui = "=0.30.2"
libc = "0.2.190"

# Examples live in the top-level `examples/` directory (PRD M13) and are
# listed here so each one runs with `cargo run --example <name>`.
[[example]]
name = "keys"
path = "../examples/keys.rs"
test = true

[[example]]
name = "hello_box"
path = "../examples/hello_box.rs"
test = true

[[example]]
name = "caps"
path = "../examples/caps.rs"
test = true

[[example]]
name = "gradient"
path = "../examples/gradient.rs"
test = true
required-features = ["color-profiles"]

[[example]]
name = "ratatui_dashboard"
path = "../examples/ratatui_dashboard.rs"
test = true

[[example]]
name = "cell_prototype"
path = "../examples/cell_prototype.rs"
test = true

[[example]]
name = "layout_prototype"
path = "../examples/layout_prototype.rs"
test = true

[[example]]
name = "cell_dump"
path = "../examples/cell_dump.rs"
test = true

[[example]]
name = "live_dashboard"
path = "../examples/live_dashboard.rs"
test = true

[[example]]
name = "demo"
path = "../examples/demo.rs"
test = true
required-features = ["app"]

[[example]]
name = "gallery"
path = "../examples/gallery.rs"
test = true

[[example]]
name = "port_ratatui_block"
path = "../examples/port_ratatui_block.rs"
test = true

[[example]]
name = "port_ratatui_paragraph"
path = "../examples/port_ratatui_paragraph.rs"
test = true

[[example]]
name = "port_ratatui_list"
path = "../examples/port_ratatui_list.rs"
test = true
