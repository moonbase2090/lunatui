[package]
name = "lunatui-term"
description = "Terminal layer for lunatui: encoder, capability probing, session and input parser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lunatui-core = { path = "../lunatui-core" }
rustix = { version = "1.0.5", default-features = false, features = ["std", "termios", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
libc = "0.2.190"
lunatui-bench = { path = "../benches" }
ratatui = "=0.30.2"

[[bin]]
name = "session-pty-probe"
path = "src/bin/session_pty_probe.rs"
test = false
