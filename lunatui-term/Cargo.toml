[package]
name = "lunatui-term"
description = "Terminal layer for lunatui: encoder, capability probing, session and input parser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
pixel-layer = []

[[test]]
name = "pixel_layer"
required-features = ["pixel-layer"]

[dependencies]
lunatui-core = { version = "0.1.6", path = "../lunatui-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
rustix = { version = "1.0.5", default-features = false, features = ["std", "termios", "fs"] }

[target.'cfg(windows)'.dependencies]
crossterm = "0.29.0"

[dev-dependencies]
libc = "0.2.190"
lunatui-bench = { path = "../benches" }
lunatui-test = { path = "../lunatui-test" }
lunatui-theme = { path = "../lunatui-theme" }
ratatui = "=0.30.2"

[[test]]
name = "theme_reencode"
path = "tests/theme_reencode.rs"

[[test]]
name = "windows_terminal"
path = "tests/windows_terminal.rs"

[[bin]]
name = "session-pty-probe"
path = "src/bin/session_pty_probe.rs"
test = false

[[bin]]
name = "fuzz_input_parser"
path = "../fuzz/fuzz_input_parser.rs"
test = false

[[test]]
name = "pixel_capture"
path = "tests/pixel_capture.rs"
required-features = ["pixel-layer"]
