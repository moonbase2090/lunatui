[package]
name = "lunatui-theme"
description = "Theme tokens, color profiles and serde themes for lunatui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lints]
workspace = true

[features]
default = []
color-profiles = []

[[test]]
name = "downsample"
path = "tests/downsample.rs"
required-features = ["color-profiles"]

[[test]]
name = "theme_tokens"
path = "tests/theme_tokens.rs"

[[test]]
name = "bundled_themes"
path = "tests/bundled_themes.rs"

[[test]]
name = "bundled_profiles"
path = "tests/bundled_profiles.rs"
required-features = ["color-profiles"]

[dev-dependencies]
lunatui-test = { version = "0.1.0", path = "../lunatui-test" }

[dependencies]
lunatui-core = { version = "0.1.0", path = "../lunatui-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8.23"
