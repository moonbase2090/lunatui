[package]
name = "lunatui-runtime"
description = "Runtime for lunatui: scheduler, Ui context, IDs and memo, hit-testing, focus, animation and keymap registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["image-presenter"]
app = []
accessibility = ["app"]
keymap = []
motion = []
effects = ["motion", "lunatui-core/blit", "lunatui-core/render-color"]
image-presenter = ["app", "dep:lunatui-image", "lunatui-term/pixel-layer"]

[[test]]
name = "keymap"
required-features = ["keymap"]

[[test]]
name = "motion"
required-features = ["motion"]

[[test]]
name = "effects"
required-features = ["effects"]

[[test]]
name = "accessibility"
required-features = ["accessibility"]

[[example]]
name = "accessibility_roles"
path = "../examples/accessibility_roles.rs"
required-features = ["accessibility"]

[dependencies]
lunatui-core = { version = "0.1.23", path = "../lunatui-core" }
lunatui-image = { version = "0.1.23", path = "../lunatui-image", optional = true }
lunatui-term = { version = "0.1.23", path = "../lunatui-term" }

[dev-dependencies]
lunatui-test = { path = "../lunatui-test" }
proptest = "1.9"

[lints]
workspace = true
