[package]
name = "lunatui-runtime"
description = "Runtime for lunatui: scheduler, Ui context, IDs and memo, hit-testing, focus, animation and keymap registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["image-presenter"]
app = []
keymap = []
motion = []
image-presenter = ["app", "dep:lunatui-image", "lunatui-term/pixel-layer"]

[[test]]
name = "keymap"
required-features = ["keymap"]

[[test]]
name = "motion"
required-features = ["motion"]

[dependencies]
lunatui-core = { version = "0.1.15", path = "../lunatui-core" }
lunatui-image = { version = "0.1.15", path = "../lunatui-image", optional = true }
lunatui-term = { version = "0.1.15", path = "../lunatui-term" }

[dev-dependencies]
proptest = "1.9"

[lints]
workspace = true
