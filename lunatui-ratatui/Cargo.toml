[package]
name = "lunatui-ratatui"
description = "ratatui compatibility for lunatui: a ratatui Backend implementation and a widget bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lunatui-core = { version = "0.1.5", path = "../lunatui-core" }
lunatui-term = { version = "0.1.5", path = "../lunatui-term" }
lunatui-widgets = { version = "0.1.5", path = "../lunatui-widgets" }
ratatui = "=0.30.2"

[dev-dependencies]
lunatui-bench = { path = "../benches" }
lunatui-test = { path = "../lunatui-test" }
lunatui-theme = { path = "../lunatui-theme" }

[[test]]
name = "backend_oracle"
path = "tests/backend_oracle.rs"

[[test]]
name = "widget_snapshots"
path = "tests/widget_snapshots.rs"

[[test]]
name = "style_roundtrip"
path = "tests/style_roundtrip.rs"
